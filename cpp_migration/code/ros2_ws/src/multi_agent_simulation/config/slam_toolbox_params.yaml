slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Frames
    map_frame: map
    odom_frame: odom
    base_frame: agilex_diff_drive/base_link
    scan_topic: /scan

    # Critical for Gazebo + bridge
    transform_timeout: 2.0
    scan_queue_size: 500
    
    # THIS is the critical one
    tf_buffer_duration: 120.0