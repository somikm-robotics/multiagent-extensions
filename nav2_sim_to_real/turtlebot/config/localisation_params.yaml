amcl:
  ros__parameters:
    use_sim_time: false

    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map

    scan_topic: /scan_fresh
    throttle_scans: 2

    min_particles: 30
    max_particles: 100

    update_min_d: 0.3
    update_min_a: 0.3

    resample_interval: 1
    transform_tolerance: 1.0
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    set_initial_pose: false


map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: /root/ros2_ws/src/turtlebot/maps/tb4_map.yaml
