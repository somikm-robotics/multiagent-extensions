global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.2
      resolution: 0.05

      # track_unknown_space: true
      update_frequency: 0.5
      publish_frequency: 0.5
      transform_tolerance: 1.0
      # initial_transform_timeout: 20.0

      plugins: ["static_layer"]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      # robot_radius: 0.2
      
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 1.0
      # initial_transform_timeout: 20.0

      plugins: ["obstacle_layer"]

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan_fresh
          # max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
