planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true


controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0
    # transform_tolerance: 1.0

    controller_plugins: ["FollowPath", "Orbit"]

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.15
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.8
      transform_tolerance: 1.0

    Orbit:
      plugin: "orbit_controller/OrbitController"

      # --- Core orbit parameters ---
      center_x: 2.55
      center_y: -1.30
      radius: 0.60

      # --- Motion tuning (critical) ---
      linear_vel: 0.08
      gain: 0.5

      # --- Direction ---
      direction: "clockwise"

      # --- Completion behaviour ---
      slow_down_start_deg: 330.0
      stop_linear_thresh: 0.02
      stop_angular_thresh: 0.05

      # --- Stability (VERY IMPORTANT for TB4) ---
      # deadband is NOT in your plugin yet → add in code
      # so here we just control gain

      # --- Safety (disable for now) ---
      use_costmap_safety: false
      safety_lookahead: 0.30
      safety_cost_threshold: 253
      safety_stop_ticks: 8

behavior_server:
  ros__parameters:
    use_sim_time: false
    behavior_plugins: ["Spin", "Backup", "DriveOnHeading"]

    Spin:
      plugin: nav2_behaviors/Spin

    Backup:
      plugin: nav2_behaviors/BackUp

    DriveOnHeading:
      plugin: nav2_behaviors/DriveOnHeading


